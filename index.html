<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f0">
  <meta name="description" content="A quiet, offline-ready SVG viewer. Open files locally and explore them with touch.">
  <meta name="color-scheme" content="light dark">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("svg-viewer-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch{document.documentElement.dataset.theme="light"}</script>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg?v=5">
  <link rel="apple-touch-icon" href="./icons/icon-192-v5.png">
  <link rel="stylesheet" href="./styles.css">
  <title>SVG Viewer</title>
</head>
<body>
  <div id="app">
    <main id="stage" class="stage" aria-label="SVG viewing area">
      <div id="artwork" class="artwork" hidden>
        <img id="preview" alt="Selected SVG artwork" draggable="false">
      </div>

    </main>

    

    <nav id="toolbar" class="toolbar" aria-label="SVG viewer controls">
      <button id="fileNameButton" class="file-name-button" type="button" aria-label="Open SVG file" title="Open SVG file">
        <span id="fileName" class="file-name">SVG Viewer</span>
        <span id="fileLocation" class="file-location" hidden></span>
      </button>
      <span class="tool-divider" aria-hidden="true"></span>
      <button id="zoomOut" class="tool-button" type="button" aria-label="Zoom out" title="Zoom out">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
      </button>
      <button id="zoomLabel" class="zoom-label" type="button" aria-label="Fit SVG to screen" title="Tap to fit">100%</button>
      <button id="zoomIn" class="tool-button" type="button" aria-label="Zoom in" title="Zoom in">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>
      </button>
      <span class="tool-divider" aria-hidden="true"></span>
      <button id="themeButton" class="tool-button theme-button" type="button" aria-label="Switch to dark mode" title="Switch to dark mode" aria-pressed="false">
        <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 15.4A8.5 8.5 0 0 1 8.6 3.6 8.5 8.5 0 1 0 20.4 15.4Z"/></svg>
        <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
      </button>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <input id="fileInput" class="visually-hidden" type="file" accept=".svg,image/svg+xml" aria-label="Choose SVG file">
  </div>
  <script defer src="./app.js"></script>
</body>
</html>
