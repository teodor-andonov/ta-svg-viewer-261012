<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f3">
  <meta name="description" content="A quiet, offline-ready SVG viewer. Open files locally and explore them with touch.">
  <meta name="color-scheme" content="light">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>SVG Viewer</title>
</head>
<body>
  <div id="app">
    <main id="stage" class="stage" data-surface="paper" aria-label="SVG viewing area">
      <div id="artwork" class="artwork" hidden>
        <img id="preview" alt="Selected SVG artwork" draggable="false">
      </div>

      <div id="emptyState" class="empty-state">
        <div class="empty-mark" aria-hidden="true">
          <svg viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="10" width="54" height="52" rx="5"/>
            <path d="M9 22h54M21 10v12"/>
            <path d="m19 50 12-16 10 11 8-8 6 13H19Z"/>
            <circle cx="48" cy="31" r="3"/>
          </svg>
        </div>
        <p class="eyebrow">YOUR CANVAS</p>
        <h1>View an SVG.</h1>
        <p class="empty-description">Open a file from your device.<br>Everything stays on your device.</p>
        <button id="openEmpty" class="primary-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0-4 4m4-4 4 4M4 17v3h16v-3"/></svg>
          Open SVG
        </button>
        <button id="sampleButton" class="text-button" type="button">Or explore the sample <span aria-hidden="true">↗</span></button>
      </div>
    </main>

    <header class="app-header">
      <div class="brand" aria-label="SVG Viewer">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 28 28" fill="none"><path d="M6 20V8h8l8 12V8" stroke="currentColor" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span>SVG<span class="brand-separator">/</span>VIEWER</span>
      </div>
      <div id="fileDetails" class="file-details" hidden>
        <span id="fileName" class="file-name"></span>
        <span id="fileMeta" class="file-meta"></span>
      </div>
      <button id="openHeader" class="header-action" type="button" aria-label="Open SVG file" title="Open SVG file">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg>
        <span>OPEN</span>
      </button>
    </header>

    <nav id="toolbar" class="toolbar" aria-label="Viewer controls" hidden>
      <button id="zoomOut" class="tool-button" type="button" aria-label="Zoom out" title="Zoom out">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
      </button>
      <button id="zoomLabel" class="zoom-label" type="button" aria-label="Fit SVG to screen" title="Tap to fit">
        100%
      </button>
      <button id="zoomIn" class="tool-button" type="button" aria-label="Zoom in" title="Zoom in">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>
      </button>
      <span class="tool-divider" aria-hidden="true"></span>
      <button id="fitButton" class="tool-button" type="button" aria-label="Fit to screen" title="Fit to screen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H4v4m12-4h4v4M4 16v4h4m12-4v4h-4"/></svg>
      </button>
      <button id="surfaceButton" class="tool-button" type="button" aria-label="Change canvas background" title="Change canvas background">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12h16M12 4v16"/></svg>
      </button>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <input id="fileInput" class="visually-hidden" type="file" accept=".svg,image/svg+xml" aria-label="Choose SVG file">
  </div>
  <script defer src="./app.js"></script>
</body>
</html>
